# ─── prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-a
set -g prefix2 None

# ─── general ─────────────────────────────────────────────────────────────────
set -g base-index 1
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 50000
set -g mouse on
set -s set-clipboard on
set -g renumber-windows off
set -g repeat-time 500
set -g display-time 2000
set -g display-panes-time 1000
set -sg escape-time 10
set -g focus-events on

# ─── activity ────────────────────────────────────────────────────────────────
set -g activity-action other
set -g bell-action any
set -g silence-action other
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# ─── clipboard / paste ───────────────────────────────────────────────────────
set -g assume-paste-time 1

# ─── titles ──────────────────────────────────────────────────────────────────
set -g set-titles off
set -g set-titles-string "#S:#I:#W - \"#T\" #{session_alerts}"

# ─── session lifecycle ───────────────────────────────────────────────────────
set -g destroy-unattached off
set -g detach-on-destroy on

# ─── lock ────────────────────────────────────────────────────────────────────
set -g lock-after-time 0
set -g lock-command "lock -np"

# ─── messages ────────────────────────────────────────────────────────────────
set -g message-style bg=yellow,fg=black
set -g message-command-style bg=black,fg=yellow
set -g message-line 0

# ─── pane borders ────────────────────────────────────────────────────────────
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour75

# ─── pane display ────────────────────────────────────────────────────────────
set -g display-panes-colour colour238
set -g display-panes-active-colour colour75

# ─── clock ───────────────────────────────────────────────────────────────────
set -g clock-mode-colour colour75
set -g clock-mode-style 24

# ─── environment ─────────────────────────────────────────────────────────────
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# ─── word separators ─────────────────────────────────────────────────────────
set -g word-separators "!\"#$%&'()*+,-./:;<=>?@[\\]^`{|}~"

# ─── status bar ──────────────────────────────────────────────────────────────
set -g status on
set -g status-position bottom
set -g status-style bg=colour235,fg=colour250
set -g status-interval 15
set -g status-justify left
set -g status-keys emacs

set -g status-left ""
set -g status-right ""
set -g status-right-length 0
set -g status-left-length 0
set -g status-right ""
set -g status-left ""

set -g status 2

set -g status on
set -g status-style bg=default,fg=colour250
set -g status-format[0] "#[bg=default,fg=colour250]#{?client_prefix,#[fg=colour75 bold]^A #[fg=colour250 nobold], }#[fg=colour246][#(pmset -g batt | grep -o '[0-9]*%%' | head -1)] [%H:%M] #[fg=colour238] ║ #{S:#{?session_attached,#[fg=colour75 bold][#S] #[fg=colour238 nobold] ,#[fg=colour244][#S] }}#[align=right]#[fg=colour238] ║ #{W:#{?#{==:#{window_index},#{active_window_index}},#[fg=colour75 bold],#[fg=colour244]}[#W] #[fg=colour238 nobold] }"
# ─── session switching (no prefix needed) ────────────────────────────────────
bind -n M-. switch-client -n
bind -n M-, switch-client -p

# ─── window switching (no prefix needed) ─────────────────────────────────────
bind -n M-/ next-window

# ─── open new panes/windows in current path ──────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
