# ─── prefix ──────────────────────────────────────────────────────────────────
set -g prefix C-a
set -g prefix2 None

# ─── general ─────────────────────────────────────────────────────────────────
set -g base-index 1
set -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
# Preserve true colour, OSC 8 hyperlinks, and modified keys in Ghostty.
# A fixed array index keeps repeated config reloads idempotent.
set -s terminal-features[100] "xterm-ghostty:RGB:hyperlinks:extkeys"
# Keep Shift+Enter distinct from Enter for terminal apps such as Codex.
set -s extended-keys on
set -s extended-keys-format csi-u
# Shared tmux UI accent. Palette slot 4 follows Ghostty's active light/dark
# theme, so borders stay soft blue in Frappe and become darker in Latte.
set-environment -g TMUX_UI_ACCENT 4
set -g history-limit 50000
set -g mouse on
set -s set-clipboard on
set -g renumber-windows off
set -g repeat-time 500
set -g display-time 2000
set -g display-panes-time 1000
set -sg escape-time 10
set -g focus-events on

# Slow copy-mode mouse scrolling from tmux's default five lines per wheel tick.
bind -T copy-mode WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode WheelDownPane select-pane \; send-keys -X -N 3 scroll-down
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 3 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 3 scroll-down
# Keep mouse-down inside copy mode so starting a drag cannot reset scrollback.
# A plain click reaches MouseUp1Pane and exits; a drag reaches MouseDragEnd1Pane
# instead, copies without clearing the highlight, and preserves the position.
bind -T copy-mode MouseDown1Pane select-pane
bind -T copy-mode-vi MouseDown1Pane select-pane
bind -T copy-mode MouseUp1Pane send-keys -X cancel
bind -T copy-mode-vi MouseUp1Pane send-keys -X cancel
bind -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# Open an HTTP(S) URL with one click. If the click is not on a URL, preserve
# tmux's normal pane-selection and application mouse-reporting behaviour.
bind -n MouseDown1Pane if-shell 'bash ~/tmux-open-url.sh --open #{mouse_x} #{q:mouse_line} #{q:mouse_hyperlink}' '' 'select-pane -t =; send-keys -M'

# ─── activity ────────────────────────────────────────────────────────────────
set -g activity-action other
set -g bell-action any
set -g silence-action other
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

# ─── clipboard / paste ───────────────────────────────────────────────────────
set -g assume-paste-time 1

# ─── titles ──────────────────────────────────────────────────────────────────
set -g set-titles off
set -g set-titles-string "#S:#I:#W - \"#T\" #{session_alerts}"

# ─── session lifecycle ───────────────────────────────────────────────────────
set -g destroy-unattached off
set -g detach-on-destroy on

# ─── lock ────────────────────────────────────────────────────────────────────
set -g lock-after-time 0
set -g lock-command "lock -np"

# ─── messages ────────────────────────────────────────────────────────────────
set -g message-style bg=yellow,fg=black
set -g message-command-style bg=black,fg=yellow
set -g message-line 0

# ─── pane borders ────────────────────────────────────────────────────────────
set -g pane-border-lines double
set -g pane-border-status bottom
# Fill each pane's bottom border segment; tmux keeps native junction cells.
set -g pane-border-format "#{s/ /═/:#{p-500:}}"
set -g pane-border-indicators off
set -gF pane-border-style "bg=default,fg=colour#{TMUX_UI_ACCENT}"
set -gF pane-active-border-style "bg=default,fg=colour#{TMUX_UI_ACCENT}"

# Use the same blue border for every popup menu.
set -gF popup-border-style "bg=default,fg=colour#{TMUX_UI_ACCENT}"

# ─── pane display ────────────────────────────────────────────────────────────
set -g display-panes-colour colour238
set -gF display-panes-active-colour "colour#{TMUX_UI_ACCENT}"

# ─── clock ───────────────────────────────────────────────────────────────────
set -gF clock-mode-colour "colour#{TMUX_UI_ACCENT}"
set -g clock-mode-style 24

# ─── environment ─────────────────────────────────────────────────────────────
set -g update-environment "DISPLAY KRB5CCNAME SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"

# ─── word separators ─────────────────────────────────────────────────────────
set -g word-separators "!\"#$%&'()*+,-./:;<=>?@[\\]^`{|}~"

# ─── status bar ──────────────────────────────────────────────────────────────
set -g status 3
set -g status-position top
set -g status-style bg=colour235,fg=colour250
set -g status-interval 15
set -g status-justify left
set -g status-keys emacs

set -g status-left ""
set -g status-right ""
set -g status-right-length 0
set -g status-left-length 0
set -g status-right ""
set -g status-left ""

set -g status 3
set -gF status-style "bg=default,fg=colour#{TMUX_UI_ACCENT}"
set -g status-format[0] "#(bash ~/tmux-status.sh #{client_width} #{q:session_name} #{q:window_name} #{pane_index} #{q:pane_current_command} #{client_prefix} #{window_id} rule-top)"
set -g status-format[1] "#(bash ~/tmux-status.sh #{client_width} #{q:session_name} #{q:window_name} #{pane_index} #{q:pane_current_command} #{client_prefix} #{window_id} content)"
set -g status-format[2] "#(bash ~/tmux-status.sh #{client_width} #{q:session_name} #{q:window_name} #{pane_index} #{q:pane_current_command} #{client_prefix} #{window_id} rule-bottom)"
# Restore the user's last color-menu choice after all shared accent options
# have been declared above.
run-shell "bash ~/tmux-ui.sh apply-accent"

# Status items are user-defined mouse ranges emitted by tmux-status.sh. Session
# clicks switch clients; dragging one session onto another persists its order.
bind -n MouseDown1Status run-shell "bash ~/tmux-ui.sh status-mouse-down #{q:mouse_status_range} #{client_pid} #{q:client_tty} #{mouse_x} #{mouse_y}"
bind -n MouseUp1Status run-shell "bash ~/tmux-ui.sh status-mouse-up #{q:mouse_status_range} #{client_pid} #{q:client_tty}"
unbind -n -q MouseDrag1Status
bind -n MouseDragEnd1Status run-shell "bash ~/tmux-session-ui.sh mouse-drag-end #{q:mouse_status_range} #{client_pid}"
bind u display-popup -E -w 78 -h 15 -T " AI Usage " "bash ~/tmux-agent-usage.sh"
bind -n M-u display-popup -E -w 78 -h 15 -T " AI Usage " "bash ~/tmux-agent-usage.sh"
bind b display-popup -E -w 48 -h 10 -T " Moving Background " "bash ~/tmux-background.sh picker"

# ─── project switching ───────────────────────────────────────────────────────
bind p display-popup -E -w 56% -h 70% -T " Projects " "bash ~/tmux-project.sh"
bind -n M-p display-popup -E -w 56% -h 70% -T " Projects " "bash ~/tmux-project.sh"
bind n if-shell -F '#{@notes_popup_open}' 'display-popup -C; set-option -gu @notes_popup_open' 'set-option -g @notes_popup_open 1; display-popup -E -w 84% -h 78% -T " Notes · #{session_name} " "bash ~/tmux-notes.sh --popup"'
bind -n M-n if-shell -F '#{@notes_popup_open}' 'display-popup -C; set-option -gu @notes_popup_open' 'set-option -g @notes_popup_open 1; display-popup -E -w 84% -h 78% -T " Notes · #{session_name} " "bash ~/tmux-notes.sh --popup"'

# ─── session switching (no prefix needed) ────────────────────────────────────
bind -n M-. run-shell "bash ~/tmux-session-ui.sh switch next #{q:client_tty}"
bind -n M-, run-shell "bash ~/tmux-session-ui.sh switch previous #{q:client_tty}"

# ─── window switching (no prefix needed) ─────────────────────────────────────
bind -n M-/ next-window

# ─── open new panes/windows in current path ──────────────────────────────────
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -p 40 -c "#{pane_current_path}"
