# Appended to the selected dark theme by tmux-theme.sh to produce the generated
# `starfield-active` theme. Kept out of the theme files themselves so the moving
# background composes with any of the ~520 themes rather than only Catppuccin.
custom-shader = shaders/moving_stars-active.glsl
custom-shader-animation = always
background-image = backgrounds/stars-cyan.jpg
background-image-opacity = 0.30
background-image-fit = cover
background-image-position = center
background-image-repeat = false
